[package]
name = "cortexa"
version = "0.1.0"
description = "Cortexa — Windows-first AI desktop assistant"
authors = ["Cortexa"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"

[features]
custom-protocol = ["tauri/custom-protocol"]
